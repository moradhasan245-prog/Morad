<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Link Generator</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f4f9; margin: 0; }
    .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
    input[type="file"] { margin: 15px 0; }
    button { background: #0070f3; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; }
    .result { margin-top: 20px; word-break: break-all; font-weight: bold; }
    a { color: #0070f3; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>ফাইল আপলোডার</h2>
    <input type="file" id="fileInput">
    <br>
    <button onclick="uploadFile()">আপলোড করুন</button>
    <div class="result" id="output"></div>
  </div>

  <script>
    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const output = document.getElementById('output');
      
      if (!fileInput.files[0]) {
        alert('অনুগ্রহ করে একটি ফাইল সিলেক্ট করুন!');
        return;
      }

      output.innerText = 'আপলোড হচ্ছে...';

      const formData = new FormData();
      formData.append('image', fileInput.files[0]);

      try {
        // ImgBB API দিয়ে সরাসরি আপলোড (ফ্রি সার্ভিস)
        const response = await fetch('https://api.imgbb.com/1/upload?key=8d4ba94b15978fbf2cfbb1a8e63b6da4', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        
        if (data.success) {
          const directUrl = data.data.url;
          output.innerHTML = 'ডিরেক্ট লিংক: <br><a href="' + directUrl + '" target="_blank">' + directUrl + '</a>';
        } else {
          output.innerText = 'আপলোডে সমস্যা হয়েছে!';
        }
      } catch (err) {
        output.innerText = 'নেটওয়ার্ক এরর বা আপলোডে সমস্যা হয়েছে!';
      }
    }
  </script>
</body>
</html>
